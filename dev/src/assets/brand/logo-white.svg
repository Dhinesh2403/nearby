<svg xmlns="http://www.w3.org/2000/svg" width="260" height="80" viewBox="0 0 260 80" role="img">
  <title>NearbyPro</title>
  <desc>NearbyPro — hyperlocal service discovery (light variant for dark backgrounds)</desc>

  <!-- Pin icon -->
  <path d="M32 4 C18 4 8 14 8 28 C8 46 32 68 32 68 C32 68 56 46 56 28 C56 14 46 4 32 4 Z" fill="#ffffff"/>
  <circle cx="32" cy="27" r="10" fill="#F5C518"/>
  <circle cx="32" cy="27" r="4" fill="#1A3C5E"/>

  <!-- NearbyPro wordmark -->
  <text x="66" y="42" font-family="system-ui,-apple-system,sans-serif" font-size="34" font-weight="800" letter-spacing="-1" fill="#ffffff">Near</text>
  <text x="154" y="42" font-family="system-ui,-apple-system,sans-serif" font-size="34" font-weight="800" letter-spacing="-1" fill="#F5C518">By</text>

  <!-- PRO badge (outlined so it stays clean on dark backgrounds) -->
  <rect x="193" y="10" width="40" height="18" rx="4" fill="none" stroke="#F5C518" stroke-width="1.5"/>
  <text x="213" y="23" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="700" fill="#F5C518" text-anchor="middle" letter-spacing="1.5">PRO</text>

  <!-- Tagline -->
  <text x="66" y="58" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="400" fill="rgba(255,255,255,0.6)" letter-spacing="0.3">Discover local services, instantly</text>
</svg>
