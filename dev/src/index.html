<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <base href="/">
  <title>NearBy Pro — Find Local Services & Small Businesses Near You</title>
  <meta name="description"
    content="Discover trusted local service providers near you. Find home bakers, tutors, salons, repair shops & more. Contact directly via call or WhatsApp. Free listing!">
  <meta name="keywords"
    content="local services near me, home baker near me, tutor near me, salon near me, small business directory India">
  <meta property="og:title" content="NearBy Pro — Find Local Services Near You">
  <meta property="og:description"
    content="Connect with verified local providers in your area. Free for customers. Free listing for providers.">
  <meta property="og:url" content="https://nearbypro.online">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">
  <meta property="og:image" content="https://nearbypro.online/assets/brand/logo.svg">
  <!-- Google AdSense — loads once, ad units placed per component -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6613739357752442"
     crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.0/src/regular/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap"
    rel="stylesheet">
</head>

<body>
  <!-- App launch splash — removed by main.ts after Angular boots -->
  <div id="nb-splash">
    <div class="nb-splash-logo">Near<span>By</span></div>
    <div class="nb-splash-tagline">Find services near you</div>
    <div class="nb-splash-bar"><div class="nb-splash-fill"></div></div>
  </div>
  <style>
    #nb-splash {
      position: fixed; inset: 0; z-index: 99999;
      background: #1A3C5E;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    #nb-splash.nb-splash-done { opacity: 0; visibility: hidden; pointer-events: none; }
    .nb-splash-logo {
      font-family: 'Inter', sans-serif; font-size: 2.8rem; font-weight: 800;
      color: #fff; letter-spacing: -1px;
      animation: splashPulse 1.2s ease-in-out infinite;
    }
    .nb-splash-logo span { color: #F59E0B; }
    .nb-splash-tagline {
      font-family: 'DM Sans', sans-serif; color: rgba(255,255,255,0.55);
      font-size: 0.9rem; letter-spacing: 0.04em;
    }
    .nb-splash-bar {
      width: 120px; height: 3px; background: rgba(255,255,255,0.15);
      border-radius: 3px; overflow: hidden; margin-top: 8px;
    }
    .nb-splash-fill {
      height: 100%; background: #F59E0B; border-radius: 3px;
      animation: splashLoad 0.9s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    @keyframes splashPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%       { transform: scale(1.04); opacity: 0.85; }
    }
    @keyframes splashLoad {
      from { width: 0; }
      to   { width: 100%; }
    }
  </style>

  <app-root></app-root>
</body>

</html>
