        "@id": "https://nearbypro.online/#organization",

        "logo": {

          "url": "https://nearbypro.online/assets/brand/icon-512.png",
          "width": 512,
          "height": 512
        },
        "description": "NearbyPro connects customers with trusted local service providers across India. Find plumbers, tutors, salons, home bakers, electricians and more.",
        "foundingLocation": {
          "@type": "Place",
          "name": "Chennai, Tamil Nadu, India"
        },
        "areaServed": {
          "@type": "Country",
          "name": "India"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer support",
          "availableLanguage": ["English", "Tamil"]
        },
        "sameAs": []
      },
      {
        "@type": "WebSite",
        "@id": "https://nearbypro.online/#website",
        "url": "https://nearbypro.online",
        "name": "NearbyPro",
        "description": "Find trusted local service providers near you",
        "publisher": { "@id": "https://nearbypro.online/#organization" },
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://nearbypro.online/browse?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      },
      {
        "@type": "WebPage",
        "@id": "https://nearbypro.online/#webpage",
        "url": "https://nearbypro.online/",
        "name": "NearbyPro — Find Local Services & Small Businesses Near You",
        "isPartOf": { "@id": "https://nearbypro.online/#website" },
        "about": { "@id": "https://nearbypro.online/#organization" },
        "description": "Discover trusted local service providers near you. Find plumbers, tutors, salons, home bakers and more. Contact directly via call or WhatsApp.",
        "breadcrumb": {
          "@type": "BreadcrumbList",
          "itemListElement": [{ "@type": "ListItem", "position": 1, "name": "Home", "item": "https://nearbypro.online/" }]
        }
      }
    ]
  }
  </script>

<body>
  <!-- App launch splash — removed by main.ts after Angular boots -->
  <div id="nb-splash">
    <div class="nb-splash-logo">Near<span>By</span></div>
    <div class="nb-splash-tagline">Find services near you</div>
    <div class="nb-splash-bar"><div class="nb-splash-fill"></div></div>
  </div>
  <style>
    #nb-splash {
      position: fixed; inset: 0; z-index: 99999;
      background: #1A3C5E;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    #nb-splash.nb-splash-done { opacity: 0; visibility: hidden; pointer-events: none; }
    .nb-splash-logo {
      font-family: 'Inter', sans-serif; font-size: 2.8rem; font-weight: 800;
      color: #fff; letter-spacing: -1px;
      animation: splashPulse 1.2s ease-in-out infinite;
    }
    .nb-splash-logo span { color: #F59E0B; }
    .nb-splash-tagline {
      font-family: 'DM Sans', sans-serif; color: rgba(255,255,255,0.55);
      font-size: 0.9rem; letter-spacing: 0.04em;
    }
    .nb-splash-bar {
      width: 120px; height: 3px; background: rgba(255,255,255,0.15);
      border-radius: 3px; overflow: hidden; margin-top: 8px;
    }
    .nb-splash-fill {
      height: 100%; background: #F59E0B; border-radius: 3px;
      animation: splashLoad 0.9s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    @keyframes splashPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%       { transform: scale(1.04); opacity: 0.85; }
    }
    @keyframes splashLoad {
      from { width: 0; }
      to   { width: 100%; }
    }
  </style>
