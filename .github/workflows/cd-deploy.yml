# .github/workflows/cd-deploy.yml
# Auto-deploy to production on every push to main
# Frontend → Vercel  |  Backend → Railway

name: Deploy to Production

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:

  # ── PRE-CHECK ─────────────────────────────────────────────────
  pre-check:
    name: Pre-deploy build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Build frontend
        working-directory: ./frontend
        run: npm ci && npm run build
      - name: Audit backend
        working-directory: ./backend
        run: npm ci && npm audit --audit-level=critical

  # ── DEPLOY FRONTEND → VERCEL ──────────────────────────────────
  # Secrets needed (GitHub → Repo → Settings → Secrets):
  #   VERCEL_TOKEN      → vercel.com → Account → Tokens
  #   VERCEL_ORG_ID     → cat frontend/.vercel/project.json → orgId
  #   VERCEL_PROJECT_ID → cat frontend/.vercel/project.json → projectId
  deploy-frontend:
    name: Frontend → Vercel
    runs-on: ubuntu-latest
    needs: pre-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: Pull Vercel env
        working-directory: ./frontend
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        working-directory: ./frontend
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        working-directory: ./frontend
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  # ── DEPLOY BACKEND → RAILWAY ──────────────────────────────────
  # Secrets needed:
  #   RAILWAY_TOKEN      → railway.app → Account → Tokens
  #   RAILWAY_SERVICE_ID → Railway project → service → Settings → copy Service ID
  deploy-backend:
    name: Backend → Railway
    runs-on: ubuntu-latest
    needs: pre-check
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy
        working-directory: ./backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service ${{ secrets.RAILWAY_SERVICE_ID }}
      - name: Health check
        run: |
          sleep 20
          curl --fail ${{ secrets.RAILWAY_PUBLIC_URL }}/health

  # ── SMOKE TEST ────────────────────────────────────────────────
  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-backend]
    steps:
      - name: Check frontend
        run: curl --fail ${{ secrets.VERCEL_URL }}
      - name: Check backend
        run: curl --fail ${{ secrets.RAILWAY_PUBLIC_URL }}/health | grep '"status":"ok"'
      - run: echo "🚀 NearBy is live!"
