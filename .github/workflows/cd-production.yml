name: Deploy Production

on:
  push:
    branches: [prod]
    paths: ['server/**']
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Render (production)
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.RENDER_PRODUCTION_URL }}
    permissions:
      deployments: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render deploy and wait
        env:
          RENDER_SERVICE_ID: ${{ secrets.RENDER_PRODUCTION_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail

          echo "Triggering deploy for service $RENDER_SERVICE_ID"
          # --fail-with-body keeps the response body on HTTP errors so failures are diagnosable.
          response=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header "Content-Type: application/json" \
            --data '{"clearCache":"do_not_clear"}' \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys") || {
              echo "::error::Render API rejected the deploy request:"
              echo "$response"
              exit 1
            }

          # The id sits at .id on the create response, but tolerate a wrapped { "deploy": {...} } too.
          deploy_id=$(printf '%s' "$response" | jq -r '.id // .deploy.id // empty')
          if [ -z "$deploy_id" ]; then
            echo "::error::Failed to trigger deploy — no deploy id in response:"
            echo "$response"
            exit 1
          fi
          echo "Created deploy $deploy_id"

          for _ in $(seq 1 60); do
            status=$(curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$deploy_id" \
              | jq -r '.status // .deploy.status')
            echo "Deploy status: $status"
            case "$status" in
              live) echo "Deploy succeeded"; exit 0 ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error::Deploy ended with status: $status"; exit 1 ;;
            esac
            sleep 15
          done

          echo "::error::Timed out waiting for deploy $deploy_id"
          exit 1

      - name: Smoke test
        run: |
          curl --fail --retry 6 --retry-delay 10 --retry-connrefused \
            "${{ vars.RENDER_PRODUCTION_URL }}/health" | grep '"status":"ok"'
