name: Deploy Production

on:
  push:
    branches: [prod]
    paths: ['server/**']
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Render (production)
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.RENDER_PRODUCTION_URL }}
    permissions:
      deployments: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.RENDER_SERVICE_ID }}" ]; then
            echo "::error::RENDER_SERVICE_ID secret is not set or empty in the production environment"
            exit 1
          fi
          if [ -z "${{ secrets.RENDER_API_KEY }}" ]; then
            echo "::error::RENDER_API_KEY secret is not set or empty"
            exit 1
          fi
          echo "Secrets are present"

      - name: Trigger Render deploy and wait
        env:
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail

          echo "Triggering deploy for service $RENDER_SERVICE_ID"

          # Write response body to a temp file; capture HTTP status code separately.
          BODY_FILE=$(mktemp)
          http_status=$(curl --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header "Content-Type: application/json" \
            --data '{"clearCache":"do_not_clear"}' \
            --output "$BODY_FILE" \
            --write-out "%{http_code}" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys")
          response=$(cat "$BODY_FILE"); rm -f "$BODY_FILE"

          echo "HTTP status: $http_status"
          echo "Response body: $response"

          if [ "$http_status" -lt 200 ] || [ "$http_status" -ge 300 ]; then
            echo "::error::Render API returned HTTP $http_status — check RENDER_SERVICE_ID and RENDER_API_KEY secrets in the production environment"
            exit 1
          fi

          # The id sits at .id on the create response, but tolerate a wrapped { "deploy": {...} } too.
          deploy_id=$(printf '%s' "$response" | jq -r '.id // .deploy.id // empty')
          if [ -z "$deploy_id" ]; then
            echo "::error::Failed to trigger deploy — no deploy id in response (HTTP $http_status):"
            echo "$response"
            exit 1
          fi
          echo "Created deploy $deploy_id"

          for _ in $(seq 1 60); do
            STATUS_FILE=$(mktemp)
            poll_status=$(curl --silent --show-error \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              --output "$STATUS_FILE" \
              --write-out "%{http_code}" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$deploy_id")
            poll_body=$(cat "$STATUS_FILE"); rm -f "$STATUS_FILE"

            if [ "$poll_status" -lt 200 ] || [ "$poll_status" -ge 300 ]; then
              echo "::error::Status poll returned HTTP $poll_status: $poll_body"
              exit 1
            fi

            status=$(printf '%s' "$poll_body" | jq -r '.status // .deploy.status')
            echo "Deploy status: $status"
            case "$status" in
              live) echo "Deploy succeeded"; exit 0 ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error::Deploy ended with status: $status"; exit 1 ;;
            esac
            sleep 15
          done

          echo "::error::Timed out waiting for deploy $deploy_id"
          exit 1

      - name: Smoke test
        run: |
          curl --fail --retry 6 --retry-delay 10 --retry-connrefused \
            "${{ vars.RENDER_PRODUCTION_URL }}/health" | grep '"status":"ok"'
