name: Deploy Staging

on:
  push:
    branches: [main]
    paths: ['server/**']
  workflow_dispatch: {}

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Render (staging)
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.RENDER_STAGING_URL }}
    permissions:
      deployments: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render deploy and wait
        uses: JorgeLNJunior/render-deploy@v1.5.0
        with:
          service_id: ${{ secrets.RENDER_SERVICE_ID }}
          api_key: ${{ secrets.RENDER_API_KEY }}
          wait_deploy: true
          github_deployment: true
          deployment_environment: staging
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test
        run: |
          curl --fail --retry 6 --retry-delay 10 --retry-connrefused \
            "${{ vars.RENDER_STAGING_URL }}/health" | grep '"status":"ok"'
