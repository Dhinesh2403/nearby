# .github/workflows/cd-staging.yml
# Deploys server/ → Render "staging" service on every push to main.
# Waits for the Render deploy to actually finish, then smoke-tests /health.
#
# Required setup (one-time):
#   1. GitHub → repo Settings → Environments → New environment: "staging"
#   2. In that environment add secrets:
#        RENDER_SERVICE_ID  → Render staging service → Settings → copy Service ID
#        RENDER_API_KEY     → Render → Account Settings → API Keys
#   3. In that environment add a variable:
#        RENDER_STAGING_URL → https://nearby-api-staging.onrender.com
 
name: Deploy Backend — Staging
 
on:
  push:
    branches: [main]
    paths: ['server/**']
  workflow_dispatch: {}
 
concurrency:
  group: deploy-staging
  cancel-in-progress: false
 
jobs:
  deploy:
    name: Deploy to Render (staging)
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.RENDER_STAGING_URL }}
    permissions:
      deployments: write
      contents: read
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Trigger Render deploy and wait for result
        uses: JorgeLNJunior/render-deploy@v1.5.0
        with:
          service_id: ${{ secrets.RENDER_SERVICE_ID }}
          api_key: ${{ secrets.RENDER_API_KEY }}
          wait_deploy: true
          github_deployment: true
          deployment_environment: staging
          github_token: ${{ secrets.GITHUB_TOKEN }}
 
      - name: Smoke test
        run: |
          curl --fail --retry 6 --retry-delay 10 --retry-connrefused \
            "${{ vars.RENDER_STAGING_URL }}/health" | grep '"status":"ok"'
 
