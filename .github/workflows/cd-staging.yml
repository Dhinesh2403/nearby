5. Set environment variables (per service, from your .env.example) — use different values per environment, especially MONGO_URI (separate DB or at least separate database name) so staging traffic never touches production data:

Variable	Staging	Production
NODE_ENV	staging	production
MONGO_URI	staging Atlas cluster/db	production Atlas cluster/db
JWT_SECRET / JWT_REFRESH_SECRET	unique per env	unique per env
CLIENT_URL	staging frontend URL	production frontend URL
CLOUDINARY_*, SMTP_*, N8N_BOOKING_WEBHOOK_URL	as needed	as needed
PORT — don't set it; Render injects this automatically and your code already reads process.env.PORT.

6. Auto-deploy behavior
Render redeploys automatically on every push to the linked branch — you don't need a GitHub Action to trigger the deploy itself. If you want deploys gated on your CI passing, set each service's Auto-Deploy setting to "After CI Checks Pass" instead of "On Commit" (Settings → Build & Deploy). This requires your ci-backend.yml to actually run and report a check on that branch.

