Replace the Railway portion of cd-deploy.yml — since Render deploys via git push, the Action's job is now just to verify the deploy succeeded, not trigger it:

yaml
name: Backend Smoke Test
on:
  push:
    branches: [main, prod]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Render deploy
        run: sleep 60
      - name: Health check
        run: |
          URL=${{ github.ref_name == 'prod' && secrets.RENDER_PROD_URL || secrets.RENDER_STAGING_URL }}
          curl --fail "$URL/health" | grep '"status":"ok"'
Add RENDER_STAGING_URL and RENDER_PROD_URL as GitHub repo secrets (your *.onrender.com URLs from each service).

Ongoing promotion flow
Once both services are live, your release flow becomes: merge feature work into main → auto-deploys to staging → verify → open a PR from main into prod → merge → auto-deploys to production.

One practical note: if you're on Render's free instance type, services spin down after inactivity and the first request after idle takes a few seconds to wake up — worth knowing for staging especially.

