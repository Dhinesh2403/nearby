name: Deploy Staging

on:
  push:
    branches: [main]
    paths: ['server/**']
  workflow_dispatch: {}

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Render (staging)
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.RENDER_STAGING_URL }}
    permissions:
      deployments: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render deploy and wait
        env:
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail

          echo "Triggering deploy for service $RENDER_SERVICE_ID"

          BODY_FILE=$(mktemp)
          http_status=$(curl --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header "Content-Type: application/json" \
            --data '{"clearCache":"do_not_clear"}' \
            --output "$BODY_FILE" \
            --write-out "%{http_code}" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys")
          response=$(cat "$BODY_FILE"); rm -f "$BODY_FILE"

          echo "HTTP status: $http_status"
          echo "Response body: $response"

          if [ "$http_status" -lt 200 ] || [ "$http_status" -ge 300 ]; then
            echo "::error::Render API returned HTTP $http_status — check RENDER_SERVICE_ID and RENDER_API_KEY secrets"
            exit 1
          fi

          deploy_id=$(printf '%s' "$response" | jq -r '.id // .deploy.id // empty')

          # Render sometimes returns 202 with empty body when a deploy is already
          # in progress or the service type does not echo the deploy object back.
          # Fall back to the most recent deploy from the list endpoint.
          if [ -z "$deploy_id" ]; then
            echo "No deploy id in trigger response — fetching latest deploy from list..."
            sleep 5
            LIST_FILE=$(mktemp)
            list_status=$(curl --silent --show-error \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              --output "$LIST_FILE" \
              --write-out "%{http_code}" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=1")
            list_body=$(cat "$LIST_FILE"); rm -f "$LIST_FILE"
            echo "List HTTP status: $list_status"
            echo "List body: $list_body"
            deploy_id=$(printf '%s' "$list_body" | jq -r '.[0].deploy.id // .[0].id // empty')
          fi

          if [ -z "$deploy_id" ]; then
            echo "::error::Could not determine a deploy id — check that RENDER_SERVICE_ID is a backend web service (not a static site)"
            exit 1
          fi
          echo "Tracking deploy $deploy_id"

          for _ in $(seq 1 60); do
            STATUS_FILE=$(mktemp)
            poll_status=$(curl --silent --show-error \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              --output "$STATUS_FILE" \
              --write-out "%{http_code}" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$deploy_id")
            poll_body=$(cat "$STATUS_FILE"); rm -f "$STATUS_FILE"

            if [ "$poll_status" -lt 200 ] || [ "$poll_status" -ge 300 ]; then
              echo "::error::Status poll returned HTTP $poll_status: $poll_body"
              exit 1
            fi

            status=$(printf '%s' "$poll_body" | jq -r '.status // .deploy.status')
            echo "Deploy status: $status"
            case "$status" in
              live) echo "Deploy succeeded"; exit 0 ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error::Deploy ended with status: $status"; exit 1 ;;
            esac
            sleep 15
          done

          echo "::error::Timed out waiting for deploy $deploy_id"
          exit 1

      - name: Smoke test
        run: |
          curl --fail --retry 6 --retry-delay 10 --retry-connrefused \
            "${{ vars.RENDER_STAGING_URL }}/health" | grep '"status":"ok"'
