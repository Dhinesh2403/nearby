Render setup (manual dashboard — recommended over Blueprint here)
For a single Node service with two environments, two independent Web Services in the Render dashboard is simpler and avoids a known Render gotcha where a single render.yaml Blueprint synced from one branch can accidentally resync resources meant for the other environment. Skip Blueprints unless you later add more services.

