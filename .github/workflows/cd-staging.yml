Architecting production-grade CI/CD pipelines with GitHub Environments
Architecting production-grade CI/CD pipelines with GitHub Environments
Drop these three files into .github/workflows/ (replacing the old cd-deploy.yml, which had the broken ./backend path and was mixing Vercel + Railway into one job). Here's how the pipeline actually flows and what you need to wire up.

The pipeline
push to develop  → ci-backend.yml runs tests (no deploy)
push to main      → ci-backend.yml tests → cd-staging.yml deploys to Render staging
PR main → prod    → ci-backend.yml tests on the PR
push to prod       → ci-backend.yml tests → cd-production.yml deploys to Render production (gated)
ci-backend.yml fixes the path bug from before (server/ not backend/) and guards npm test with --passWithNoTests, since jest is configured but you don't have any test files yet — worth fixing before this becomes a false sense of safety.

The two CD workflows don't rely on Render's git auto-deploy at all — they explicitly trigger a deploy via the Render API (JorgeLNJunior/render-deploy, a well-maintained third-party action), wait for it to actually finish, and only then run the smoke test. That gets you a real pass/fail signal in GitHub instead of a blind sleep 60 and a hope. It also creates a GitHub Deployment entry, so you get a visible deploy history with status under the repo's Environments tab.

One-time setup
In Render, set each service's Auto-Deploy to "Off" (Settings → Build & Deploy) — since the Action is now triggering deploys explicitly, you don't want Render also deploying on every git push, or you'll get duplicate deploys racing each other.

In GitHub, repo Settings → Environments, create two environments:

staging — add secrets RENDER_SERVICE_ID and RENDER_API_KEY (your staging service's ID and a Render account API key), and a variable RENDER_STAGING_URL.

production — same two secrets pointed at your production service, plus variable RENDER_PRODUCTION_URL. This is the one worth spending an extra minute on: under "Deployment protection rules," add yourself (or a teammate) as a required reviewer. That means even after you push to prod, the deploy job pauses and waits for someone to click approve in the Actions tab before it actually ships — a real safety net for the branch that's hardest to undo mistakes on.

Promotion flow this gives you
Work happens on develop or feature branches → PR into main (tests run, merge deploys to staging automatically) → verify on staging → PR main into prod (tests run again on the diff) → merge → production deploy waits for your manual approval → ships.

A couple of things I left out on purpose: I didn't touch ci-frontend.yml, which likely has the same ./frontend vs ./dev path bug — happy to fix that and add matching staging/production Vercel deploy workflows if you want the frontend on the same two-environment model. Also worth knowing: RENDER_API_KEY is an account-wide key, so treat it as sensitive as a root credential — scoping it to the environment secrets like above (rather than a plain repo secret) at least limits which workflows can read it.


