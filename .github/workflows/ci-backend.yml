name: Backend CI

on:
  push:
    branches: [main, develop, prod]
    paths: ['server/**', '.github/workflows/ci-backend.yml']
  pull_request:
    branches: [main, develop, prod]
    paths: ['server/**']

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Audit
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        working-directory: ./server
        run: npm ci

      - name: Run tests
        working-directory: ./server
        env:
          NODE_ENV: test
          PORT: 5001
          MONGO_URI: mongodb://localhost:27017/nearby_ci
          JWT_SECRET: ci_secret_replace_in_production_64chars_minimum
          JWT_REFRESH_SECRET: ci_refresh_replace_in_production_64chars_min
          JWT_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: 7d
          CLIENT_URL: http://localhost:4200
        # --passWithNoTests keeps the pipeline green until real test files exist —
        # remove this flag once you've added tests under server/src/**/__tests__
        run: npm test -- --passWithNoTests

      - name: Security audit
        working-directory: ./server
        run: npm audit --audit-level=high
        continue-on-error: true